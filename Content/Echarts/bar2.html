<!DOCTYPE html>
<html lang="en" style="height: 100%">
<head>
  <meta charset="utf-8">
  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body style="height: 100%; margin: 0; background-color: transparent; overflow: hidden;">
  <div id="container" style="width: 100vw; height: 100vh;"></div>

  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <script type="text/javascript">
    var dom = document.getElementById('container');
    
    window.myBarChart = echarts.init(dom, null, { 
      renderer: 'canvas',
      devicePixelRatio: 2 
    });

    var icons = {
      '影视观赏': '🎬', '棋牌娱乐': '🃏', '手工课堂': '🎨', 
      '音乐活动': '🎵', '健身游戏': '🎮', '康养交流': '🍵'
    };

    var option = {
      backgroundColor: 'transparent',
      grid: {
        top: '15%',    // 增加顶部空间留给 Emoji 标签
        left: '4%',
        right: '4%',
        bottom: '15%', // 关键修改：从 65% 改为 15%，让 Y 轴高度撑开
        containLabel: true
      },
      xAxis: {
        type: 'category',
        data: ['影视观赏', '棋牌娱乐', '手工课堂', '音乐活动', '健身游戏', '康养交流'],
        axisTick: { show: false },
        axisLine: { lineStyle: { color: 'rgba(255,255,255,0.3)' } },
        axisLabel: {
          color: '#ffffff',
          fontSize: 11,      
          interval: 0,
          margin: 15
        }
      },
      yAxis: {
        type: 'value',
        max: 100,
        splitNumber: 3, 
        axisLabel: { 
          formatter: '{value}%',
          color: '#aaaaaa',
          fontSize: 10
        },
        splitLine: {
          lineStyle: { color: 'rgba(255,255,255,0.1)', type: 'solid' }
        }
      },
      series: [
        {
          type: 'bar',
          barWidth: '40%',
          itemStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: '#01D5E2' },
              { offset: 1, color: '#0069FA' }
            ]),
            borderRadius: [4, 4, 0, 0]
          },
          label: {
            show: true,
            position: 'top',
            distance: 6,
            color: '#ffffff',
            formatter: function(params) {
              return icons[params.name] + ' ' + params.value + '%';
            },
            fontSize: 12,
            fontWeight: 'bold',
            fontFamily: 'Microsoft YaHei, sans-serif'
          },
          data: [75, 45, 60, 85, 40, 55]
        }
      ]
    };

    window.myBarChart.setOption(option);

    window.initUEBridge = function() {
      if (typeof ue === "undefined") { ue = {}; }
      if (typeof ue.interface === "undefined") { ue.interface = {}; }

      ue.interface.ue2js = function(ueData) {
        try {
          var jsonObj = (typeof ueData === 'string') ? JSON.parse(ueData) : ueData;
          var newData = [
            parseFloat(jsonObj.movies || 0),
            parseFloat(jsonObj.chess || 0),
            parseFloat(jsonObj.craft || 0),
            parseFloat(jsonObj.music || 0),
            parseFloat(jsonObj.game || 0),
            parseFloat(jsonObj.health || 0)
          ];

          window.myBarChart.setOption({
            series: [{ data: newData }]
          }, { lazyUpdate: false });
          
        } catch (err) {
          console.error("Update Error: ", err);
        }
      };
    };

    window.initUEBridge();

    // 保持 ResizeObserver 逻辑，确保全屏时自动适配
    const resizeObserver = new ResizeObserver(() => {
      if (window.myBarChart) {
        window.myBarChart.resize();
      }
    });
    resizeObserver.observe(dom);

  </script>
</body>
</html>
