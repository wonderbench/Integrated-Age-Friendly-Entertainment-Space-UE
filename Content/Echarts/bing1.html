<!DOCTYPE html>
<html lang="en" style="height: 100%">
<head>
  <meta charset="utf-8">
</head>
<body style="height: 100%; margin: 0; background-color: transparent; overflow: hidden;">
  <!-- 修改点 1: 将固定像素改为百分比/视口单位，使其具备缩放基础 -->
  <div id="container" style="width: 100vw; height: 100vh;"></div>

  <script type="text/javascript" src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <script type="text/javascript">
    var dom = document.getElementById('container');
    // 将 myChart 挂载到 window，防止长时间运行后被垃圾回收机制误删
    window.myChart = echarts.init(dom, null, { renderer: 'canvas' });

    var option = {
      backgroundColor: 'transparent',
      title: [
        {
          text: '现场施工安装',
          left: '24%',
          top: '84%',
          textAlign: 'center',
          textStyle: { color: '#fff', fontSize: 12, fontWeight: 'bold' }
        },
        {
          text: '预制产品安装',
          left: '64%',
          top: '84%',
          textAlign: 'center',
          textStyle: { color: '#fff', fontSize: 12, fontWeight: 'bold' }
        }
      ],
      legend: {
        show: true,
        orient: 'vertical',
        data: ['已安装', '待安装'],
        right: '4',
        top: 'center',
        itemWidth: 12,
        itemHeight: 12,
        itemGap: 15,
        textStyle: { color: '#ccc', fontSize: 15 }
      },
      tooltip: { trigger: 'item' },
      series: [
        {
          name: '现场施工',
          type: 'pie',
          radius: ['35%', '60%'], 
          center: ['24%', '48%'],
          avoidLabelOverlap: false,
          label: {
            show: true,
            position: 'center',
            formatter: '{d}%',
            fontSize: 16,
            fontWeight: 'bold',
            color: '#fff'
          },
          data: [
            { value: 65, name: '已安装', itemStyle: { color: '#01D5E2' } },
            { value: 35, name: '待安装', itemStyle: { color: 'rgba(255,255,255,0.15)' } }
          ]
        },
        {
          name: '预制产品',
          type: 'pie',
          radius: ['35%', '60%'], 
          center: ['65%', '48%'],
          avoidLabelOverlap: false,
          label: {
            show: true,
            position: 'center',
            formatter: '{d}%',
            fontSize: 16,
            fontWeight: 'bold',
            color: '#fff'
          },
          data: [
            { value: 85, name: '已安装', itemStyle: { color: '#0069FA' } },
            { value: 15, name: '待安装', itemStyle: { color: 'rgba(255,255,255,0.15)' } }
          ]
        }
      ]
    };

    window.myChart.setOption(option);

    // --- UE5 通信接口封装 ---
    window.initUEBridge = function() {
        if (typeof ue === "undefined") { ue = {}; }
        if (typeof ue.interface === "undefined") { ue.interface = {}; }

        ue.interface.ue2js = function(ueData) {
            try {
                var jsonObj = (typeof ueData === 'string') ? JSON.parse(ueData) : ueData;
                var onsite = parseFloat(jsonObj.onsite ?? 0);
                var precast = parseFloat(jsonObj.precast ?? 0);

                if (window.myChart) {
                    window.myChart.setOption({
                        series: [
                            { data: [
                                { value: onsite, name: '已安装', itemStyle: { color: '#01D5E2' } },
                                { value: Math.max(0, 100 - onsite), name: '待安装', itemStyle: { color: 'rgba(255,255,255,0.15)' } }
                            ]},
                            { data: [
                                { value: precast, name: '已安装', itemStyle: { color: '#0069FA' } },
                                { value: Math.max(0, 100 - precast), name: '待安装', itemStyle: { color: 'rgba(255,255,255,0.15)' } }
                            ]}
                        ]
                    }, {
                        notMerge: false,
                        lazyUpdate: false
                    });
                }
            } catch (err) {
                console.error("UE Update Error: ", err);
            }
        };
    };

    // 初始化接口
    window.initUEBridge();

    // 修改点 2: 使用 ResizeObserver 替换原来的 window resize 监听
    // 这能确保即使在 UE 环境下容器尺寸微调，图表也能精准重绘
    const resizeObserver = new ResizeObserver(() => {
      if (window.myChart) {
        window.myChart.resize();
      }
    });
    resizeObserver.observe(dom);

  </script>
</body>
</html>
