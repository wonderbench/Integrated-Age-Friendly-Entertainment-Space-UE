<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>能耗曲线</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent}html{overflow:hidden}body{position:relative;isolation:isolate;overflow:visible}body::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#29241d 0%,#18130d 100%);border-radius:0 0 12px 12px}canvas{display:block;width:100%;height:100%}#tip{display:none;position:absolute;pointer-events:none;background:#24180fed;border:1px solid #b98d4c;padding:6px;color:#f4ead7;font:13px sans-serif}</style></head>
<body><canvas id="chart" aria-label="能耗曲线，示例日数据，单位kWh"></canvas><div id="tip"></div>
<script>
// Preserve the existing WebInterface -> ue.interface.ue2js integration.
if(typeof ue!=='object')window.ue={};
if(typeof ue.interface!=='object')ue.interface={};
const canvas=document.getElementById('chart'),ctx=canvas.getContext('2d'),tip=document.getElementById('tip');
const sample=[20,23,34,38,44,56,62,62,67,78,86,88,84,75,75,71,66,63,52,48,43,33,25,21,20];
let model={electric:sample,labels:sample.map((_,i)=>String(i).padStart(2,'0')+':00'),water:null,sample:true};
let plot;
function draw(){
 const width=canvas.clientWidth,height=canvas.clientHeight,dpr=window.devicePixelRatio||1;
 canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
 const sx=width/520,sy=height/303;ctx.save();ctx.scale(sx,sy);
 const p={x:40,y:40,w:452,h:221};plot={...p,sx,sy};
 const max=Math.max(100,Math.ceil(model.electric.reduce((m,v)=>Math.max(m,v),0)/20)*20);
 ctx.font='14px "Microsoft YaHei",sans-serif';ctx.fillStyle='#f3ead9';ctx.textBaseline='middle';
 ctx.strokeStyle='#e8bd70';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(40,17);ctx.lineTo(69,17);ctx.stroke();ctx.fillText('能耗（kWh）',79,17);
 ctx.lineWidth=.6;ctx.setLineDash([2,2]);ctx.strokeStyle='#86643470';
 for(let i=0;i<=5;i++){let y=p.y+p.h*(1-i/5);ctx.beginPath();ctx.moveTo(p.x,y);ctx.lineTo(p.x+p.w,y);ctx.stroke();ctx.textAlign='right';ctx.fillText(String(max*i/5),p.x-10,y);}
 const ticks=Math.min(7,Math.max(1,model.labels.length));
 for(let i=0;i<ticks;i++){const idx=Math.round((model.labels.length-1)*i/Math.max(1,ticks-1)),x=p.x+p.w*idx/Math.max(1,model.labels.length-1);ctx.beginPath();ctx.moveTo(x,p.y);ctx.lineTo(x,p.y+p.h);ctx.stroke();ctx.textAlign='center';ctx.fillText(model.labels[idx]||'',x,p.y+p.h+22);}
 ctx.setLineDash([]);ctx.strokeStyle='#baa78899';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y+p.h);ctx.lineTo(p.x+p.w,p.y+p.h);ctx.stroke();
 const points=model.electric.map((v,i)=>[p.x+i*p.w/Math.max(1,model.electric.length-1),p.y+p.h*(1-v/max)]);
 if(points.length){
  ctx.beginPath();ctx.moveTo(points[0][0],p.y+p.h);for(const q of points)ctx.lineTo(...q);ctx.lineTo(points[points.length-1][0],p.y+p.h);ctx.closePath();
  const gradient=ctx.createLinearGradient(0,p.y,0,p.y+p.h);gradient.addColorStop(0,'#bd8f497a');gradient.addColorStop(1,'#bd8f4908');ctx.fillStyle=gradient;ctx.fill();
  ctx.beginPath();points.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q));ctx.strokeStyle='#e5b968';ctx.lineWidth=2.5;ctx.shadowColor='#d99c42';ctx.shadowBlur=7;ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='#f7d99d';for(const q of points){ctx.beginPath();ctx.arc(q[0],q[1],3,0,Math.PI*2);ctx.fill();}
 }
 // Legacy callers supplying both electric and water keep their secondary series.
 if(model.water?.length){const maxW=model.water.reduce((m,v)=>Math.max(m,v),1)*1.15;ctx.beginPath();model.water.forEach((v,i)=>{const x=p.x+i*p.w/Math.max(1,model.water.length-1),y=p.y+p.h*(1-v/maxW);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#c4ad86';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#c4ad86';ctx.textAlign='right';ctx.fillText('用水量（吨，独立比例）',492,17);}
 if(!points.length){ctx.fillStyle='#b8aa91';ctx.textAlign='center';ctx.fillText('暂无能耗数据',p.x+p.w/2,p.y+p.h/2);}
 ctx.restore();
}
const MAX_POINTS=2048,MAX_VALUE=1e12;
function numeric(values){
 if(!Array.isArray(values)||values.length>MAX_POINTS)return null;
 values=Array.from(values);
 if(!values.every(v=>(typeof v==='number'||(typeof v==='string'&&v.trim()!==''))&&Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=MAX_VALUE))return null;
 return values.map(Number);
}
ue.interface.ue2js=function(value){
 try{
  const data=typeof value==='string'?JSON.parse(value):value;
  if(!data||typeof data!=='object'||Array.isArray(data))return false;
  const electric=numeric(data.electric??data.values);if(electric===null)return false;
  const water=data.water==null?null:numeric(data.water);
  if(data.water!=null&&(water===null||water.length!==electric.length))return false;
  if(data.labels!=null&&(!Array.isArray(data.labels)||data.labels.length!==electric.length||!Array.from(data.labels).every(v=>typeof v==='string'||(typeof v==='number'&&Number.isFinite(v)))))return false;
  const next={electric,water,sample:false,labels:data.labels?data.labels.map(String):electric.map((_,i)=>electric.length===12?(i+1)+'月':String(Math.round(i*24/Math.max(1,electric.length-1))).padStart(2,'0')+':00')};
  const previous=model;model=next;
  try{draw();}catch(error){model=previous;throw error;}
  canvas.setAttribute('aria-label',electric.length?'能耗曲线，外部数据，单位kWh':'能耗曲线，暂无数据');tip.style.display='none';return true;
 }catch(error){console.error('Energy data rejected',error);return false;}
};
canvas.addEventListener('mousemove',e=>{if(!plot||!model.electric.length)return;const x=e.offsetX/plot.sx;const i=Math.max(0,Math.min(model.electric.length-1,Math.round((x-plot.x)/plot.w*(model.electric.length-1))));tip.textContent=model.labels[i]+'  '+model.electric[i]+' kWh'+(model.sample?'（示例）':'');tip.style.display='block';tip.style.left=Math.min(e.offsetX+10,canvas.clientWidth-170)+'px';tip.style.top=Math.max(0,e.offsetY-32)+'px';});canvas.addEventListener('mouseleave',()=>tip.style.display='none');
new ResizeObserver(draw).observe(canvas);draw();
window.energyChart={getData:()=>JSON.parse(JSON.stringify(model)),redraw:draw};
</script></body></html>
