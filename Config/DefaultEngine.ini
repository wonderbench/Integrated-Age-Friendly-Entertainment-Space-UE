[ConsoleVariables]
; Avoid deprecated ray-traced translucency after the 2026-09-04 GPU page fault.
; Keep DX12 and other ray tracing features enabled; use raster translucency.
r.RayTracing.Translucency=0
; Reduce SMRT temporal grain in LivingGrove's broad, animated foliage shadows.
; Directional lights only; keep local-light samples and adaptive early-out unchanged.
; Fixed quality floor across scalability presets; see docs/GROVE_SHADOW_STABILITY_20261102.md.
r.Shadow.Virtual.SMRT.RayCountDirectional=64
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=8

